# Yerel Geliştirme Veri Tabanı Ortamı — Sprint 1 (Issue #31)
# Sorumlu: Buğra Durmuş (Veri Tabanı Yöneticisi / DevOps)
#
# Kullanım:
#   cd database
#   docker compose up -d
#   docker compose down

services:
  db:
    image: postgres:15-alpine
    container_name: sektech-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sektech
    ports:
      - "5433:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d sektech"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata_dev:
