openapi: 3.0.3
info:
  title: SEK TECH Proje Yönetim Sistemi API
  version: 0.5.0
  description: |
    API sözleşmesi **v0.5** (kart #30), kimlik doğrulama API'si (kart #37), RBAC ve proje API'si (kart #44), görev ve yorum API'si (kart #51).

    - Tüm yanıtlar JSON. Başarılı yanıt `{ "data": ... }`, hata yanıtı `{ "error": { "code", "message", "details?" } }`.
    - Kimlik doğrulama: `POST /api/auth/login` ile alınan token `Authorization: Bearer <token>` başlığında gönderilir.
    - Yetki (RBAC, #44): rol izinleri `roles.permissions` alanından her istekte okunur; yetkisiz işlem → 403 `FORBIDDEN`.
    - **Uygulanan** uç noktalar: `Health`, `Auth`, `Users`, `Projects`, `Tasks`, `Comments`. Diğer etiketlerdeki uç noktalar sözleşme taslağıdır
      (`x-durum: planlandı`), ilgili sprint'te uygulanacak ve Sprint 2 sonunda (Hakan, #33) dondurulacaktır.
    - Seed kullanıcıları: `hakan@sektech.com` (Yönetici), `utku@sektech.com` (Ekip Üyesi) … parola `Password123!`.
servers:
  - url: http://localhost:5000
    description: Yerel geliştirme
tags:
  - name: Health
  - name: Auth
    description: Kayıt, giriş ve oturum (M2) — uygulandı
  - name: Users
    description: Kullanıcılar ve kullanıcı yönetimi (M2) — uygulandı (#37, #44)
  - name: Projects
    description: Proje ve üyelik (M1) — uygulandı (#44)
  - name: Tasks
    description: Görevler ve durum geçmişi (M1) — uygulandı (#51)
  - name: Comments
    description: Görev yorumları (M4) — uygulandı (#51)
  - name: Files
    description: Dosyalar (M4) — planlandı, Sprint 5 (#58)
  - name: Reports
    description: Raporlama (M5) — planlandı, Sprint 6 (#65)

paths:
  /api/health:
    get:
      tags: [Health]
      summary: Servis ve veri tabanı durumu
      responses:
        '200':
          description: Çalışıyor
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status: { type: string, example: ok }
                      database: { type: string, example: up }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/auth/register:
    post:
      tags: [Auth]
      summary: Yeni kullanıcı kaydı (varsayılan rol Ekip Üyesi)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Kullanıcı oluşturuldu, oturum açıldı
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/auth/login:
    post:
      tags: [Auth]
      summary: E-posta ve şifre ile giriş
      description: 'SRS 4.2 — aynı IP adresinden 15 dakikada en fazla 5 başarısız deneme; aşımda 429.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Giriş başarılı
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Oturumdaki kullanıcı
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Kullanıcı bilgisi
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/users:
    get:
      tags: [Users]
      summary: Kullanıcıları listele (Yönetici)
      description: Yalnızca `user:manage` izni olan rol (Yönetici). Ekip Üyesi → 403 (#104).
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Kullanıcı listesi
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Users]
      summary: Kullanıcı ekle (Yönetici)
      description: Kayıttaki ad/e-posta/parola kuralları geçerlidir. `role` verilmezse Ekip Üyesi.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserCreateInput' }
      responses:
        '201':
          description: Oluşturuldu
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/users/{id}:
    get:
      tags: [Users]
      summary: Kullanıcı detayı (Yönetici herkesi, diğerleri yalnızca kendini)
      description: Başka bir kullanıcının kimliği, kullanıcı var olsun olmasın 403 döner (#110). 404 yalnızca Yönetici için.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Kullanıcı
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/users/{id}/role:
    patch:
      tags: [Users]
      summary: Kullanıcının rolünü değiştir (Yönetici)
      description: Yeni yetkiler kullanıcının mevcut token'ıyla hemen geçerli olur. Yönetici kendi rolünü değiştiremez (400).
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [Yönetici, Ekip Üyesi] }
      responses:
        '200':
          description: Güncellendi
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/projects:
    get:
      tags: [Projects]
      summary: Projeler — Yönetici tümünü, Ekip Üyesi yalnız üyesi olduklarını görür
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Proje listesi
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Project' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Projects]
      summary: Proje oluştur (Yönetici) — oluşturan sahip ve üye olur
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectInput' }
      responses:
        '201':
          description: Oluşturuldu
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Project' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/projects/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Projects]
      summary: Proje detayı (üyeler dahil)
      description: Üyesi olmayan Ekip Üyesi için 404 döner (projenin varlığı sızdırılmaz).
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Proje
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ProjectDetail' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Projects]
      summary: Projeyi güncelle (Yönetici) — yalnız gönderilen alanlar değişir
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectUpdateInput' }
      responses:
        '200':
          description: Güncellendi
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Project' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Projects]
      summary: Projeyi sil (Yönetici) — görevler, üyelikler ve dosyalar birlikte silinir
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Silindi }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/projects/{id}/members:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Projects]
      summary: Projeye üye ekle (Yönetici)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: integer }
      responses:
        '201':
          description: Eklendi
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      project_id: { type: integer }
                      user_id: { type: integer }
                      joined_at: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/projects/{id}/members/{userId}:
    delete:
      tags: [Projects]
      summary: Projeden üye çıkar (Yönetici)
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: userId, in: path, required: true, schema: { type: integer } }
      responses:
        '204': { description: Çıkarıldı }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------------------
  # Görevler ve yorumlar — uygulandı (#51). Karar 9–13 (#47) bu bölüme işlendi.
  # ---------------------------------------------------------------------------
  /api/projects/{id}/tasks:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Tasks]
      summary: Projedeki görevler (filtre — durum, öncelik, tür, kişi, tarih aralığı)
      description: |
        Proje üyeleri ve Yönetici görür; üye olmayan 404 alır (projenin varlığı sızdırılmaz, TS-ROL-04).
        `from`/`to` takvim ve Gantt içindir (#58): aralıkla **kesişen** görevler döner. Tek tarihi olan görev o güne
        yerleşir; hiç tarihi olmayan görev aralık sorgusunda dönmez.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/TaskStatus' } }
        - { name: priority, in: query, schema: { $ref: '#/components/schemas/TaskPriority' } }
        - { name: type, in: query, schema: { $ref: '#/components/schemas/TaskType' } }
        - { name: assigneeId, in: query, schema: { type: integer, minimum: 1 } }
        - { name: from, in: query, schema: { type: string, format: date }, description: 'YYYY-AA-GG' }
        - { name: to, in: query, schema: { type: string, format: date }, description: 'YYYY-AA-GG; from tarihinden önce olamaz' }
      responses:
        '200':
          description: Görev listesi (id sırasıyla)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Task' } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Tasks]
      summary: Görev oluştur — projenin her üyesi (Karar 9)
      description: |
        Ekip Üyesi yalnız kendine atayabilir; `assignee_id` gönderilmezse görev kendisine atanır. Başkasına atama → 403 (Karar 10).
        Yönetici projenin herhangi bir üyesine atayabilir; proje üyesi olmayan kişiye atama → 400 (TS-GRV-02).
        Oluşturma, durum geçmişine `old_status: null` ile ilk kaydı yazar.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskInput' }
      responses:
        '201':
          description: Oluşturuldu
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Task' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/tasks/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Tasks]
      summary: Görevi güncelle / durum değiştir / ata — yalnız gönderilen alanlar değişir
      description: |
        - **Durum** (`status`): projenin her üyesi değiştirebilir. Değişiklik aynı transaction içinde
          `task_status_history` tablosuna kim/eski/yeni olarak yazılır (FR-08); aynı duruma geçiş kayıt üretmez.
        - **Diğer alanlar:** Yönetici her görevi, Ekip Üyesi yalnız kendisine atanmış görevi düzenler (Karar 10); aksi 403.
        - **Atama** (`assignee_id` değişikliği): yalnız Yönetici; aksi 403. Proje dışı kişi → 400.
        - Tarih sırası mevcut değerlerle birlikte denetlenir.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskUpdateInput' }
      responses:
        '200':
          description: Güncellendi
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Task' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Tasks]
      summary: Görevi sil (Yönetici) — yorumları ve durum geçmişi birlikte silinir
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Silindi }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/tasks/{id}/history:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Tasks]
      summary: Görevin durum geçmişi — kronolojik (Karar 12, FR-08, US-05)
      description: |
        v0.5 dondurulduktan sonra #47 Karar 12 ile eklendi (Karar 2 gereği gerekçe: US-05 "Geçmiş sekmesi", FR-08).
        Salt okunurdur; geçmiş kayıtları API üzerinden değiştirilemez veya silinemez (FR-08.3).
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Durum değişiklikleri (eskiden yeniye)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/TaskHistory' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/tasks/{id}/comments:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Comments]
      summary: Görev yorumları — kronolojik
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Yorum listesi (eskiden yeniye)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Comment' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Comments]
      summary: Yorum ekle — projenin her üyesi; yazar sunucuda oturumdaki kullanıcıdır
      description: İstemcinin gönderdiği `author_id` yok sayılır. İçerik olduğu gibi saklanır; HTML olarak işlenmemesi arayüzün sorumluluğudur.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, minLength: 1, maxLength: 5000, description: 'Baştaki/sondaki boşluklar kırpılır; yalnız boşluk → 400' }
      responses:
        '201':
          description: Eklendi
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Comment' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------------------
  # Planlanan uç noktalar (sözleşme taslağı v0.5)
  # ---------------------------------------------------------------------------
  /api/projects/{id}/files:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Files]
      x-durum: planlandı
      summary: Proje dosyaları
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Dosya listesi }
    post:
      tags: [Files]
      x-durum: planlandı
      summary: Dosya yükle (multipart, tür ve boyut sınırlı)
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        '201': { description: Yüklendi }
        '400': { $ref: '#/components/responses/ValidationError' }

  /api/files/{id}/download:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Files]
      x-durum: planlandı
      summary: Dosya indir (yalnızca proje üyeleri)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Dosya içeriği }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/projects/{id}/reports/progress:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Reports]
      x-durum: planlandı
      summary: Proje ilerleme yüzdesi ve kişi bazlı tamamlama
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Rapor }

  /api/projects/{id}/reports/periodic:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Reports]
      x-durum: planlandı
      summary: Günlük / haftalık / aylık ilerleme raporu
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: period, in: query, required: true, schema: { type: string, enum: [daily, weekly, monthly] } }
      responses:
        '200': { description: Rapor }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
  schemas:
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 2, maxLength: 100, example: Ayşe Yılmaz }
        email: { type: string, format: email, example: ayse@sektech.com }
        password: { type: string, minLength: 8, maxLength: 72, description: 'SRS FR-01 — en az bir büyük harf, bir küçük harf, bir rakam ve bir özel karakter', example: 'Gizli123!' }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: hakan@sektech.com }
        password: { type: string, example: Password123! }
    User:
      type: object
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: Hakan Koço }
        email: { type: string, example: hakan@sektech.com }
        role: { type: string, enum: [Yönetici, Ekip Üyesi] }
        created_at: { type: string, format: date-time }
    AuthResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            user: { $ref: '#/components/schemas/User' }
            token: { type: string, description: JWT (8 saat geçerli) }
    TaskStatus:
      type: string
      enum: [To Do, In Progress, Done]
    UserCreateInput:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        email: { type: string, format: email, maxLength: 100 }
        password: { type: string, minLength: 8, maxLength: 72, description: 'Büyük harf, küçük harf, rakam ve özel karakter' }
        role: { type: string, enum: [Yönetici, Ekip Üyesi], default: Ekip Üyesi }
    Project:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string, nullable: true }
        start_date: { type: string, format: date, nullable: true, example: '2026-11-01' }
        end_date: { type: string, format: date, nullable: true, example: '2026-11-30' }
        owner_id: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }
    ProjectMember:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        role: { type: string, enum: [Yönetici, Ekip Üyesi] }
        joined_at: { type: string, format: date-time }
    ProjectDetail:
      allOf:
        - { $ref: '#/components/schemas/Project' }
        - type: object
          properties:
            members: { type: array, items: { $ref: '#/components/schemas/ProjectMember' } }
    ProjectInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        description: { type: string, nullable: true, maxLength: 5000, description: Boş metin null sayılır }
        start_date: { type: string, format: date, nullable: true, description: 'YYYY-AA-GG; boş metin null sayılır' }
        end_date: { type: string, format: date, nullable: true, description: start_date'ten önce olamaz }
    ProjectUpdateInput:
      type: object
      minProperties: 1
      description: ProjectInput alanlarından en az biri. Tarih sırası mevcut değerlerle birlikte kontrol edilir.
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        description: { type: string, nullable: true }
        start_date: { type: string, format: date, nullable: true }
        end_date: { type: string, format: date, nullable: true }
    TaskPriority:
      type: string
      enum: [Low, Medium, High, Critical]
    TaskType:
      type: string
      enum: [Task, Bug, Feature]
      description: Görev türü (Karar 11)
    Task:
      type: object
      properties:
        id: { type: integer }
        project_id: { type: integer }
        title: { type: string, maxLength: 150 }
        description: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/TaskStatus' }
        priority: { $ref: '#/components/schemas/TaskPriority' }
        type: { $ref: '#/components/schemas/TaskType' }
        assignee_id: { type: integer, nullable: true }
        start_date: { type: string, format: date, nullable: true, example: '2026-11-05' }
        end_date: { type: string, format: date, nullable: true, example: '2026-11-10' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TaskInput:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 150, description: 'Karar 13 / SRS FR-06: en fazla 150 karakter' }
        description: { type: string, nullable: true, maxLength: 5000, description: Boş metin null sayılır }
        status: { allOf: [{ $ref: '#/components/schemas/TaskStatus' }], default: To Do }
        priority: { allOf: [{ $ref: '#/components/schemas/TaskPriority' }], default: Medium }
        type: { allOf: [{ $ref: '#/components/schemas/TaskType' }], default: Task }
        assignee_id: { type: integer, nullable: true, description: 'Proje üyesi olmalı. Ekip Üyesi yalnız kendi kimliğini gönderebilir; gönderilmezse görev kendisine atanır.' }
        start_date: { type: string, format: date, nullable: true, description: 'YYYY-AA-GG; boş metin null sayılır' }
        end_date: { type: string, format: date, nullable: true, description: 'start_date tarihinden önce olamaz' }
    TaskUpdateInput:
      type: object
      minProperties: 1
      description: TaskInput alanlarından en az biri. Yetki kuralları için PATCH /api/tasks/{id} açıklamasına bakın.
      properties:
        title: { type: string, minLength: 1, maxLength: 150 }
        description: { type: string, nullable: true, maxLength: 5000 }
        status: { $ref: '#/components/schemas/TaskStatus' }
        priority: { $ref: '#/components/schemas/TaskPriority' }
        type: { $ref: '#/components/schemas/TaskType' }
        assignee_id: { type: integer, nullable: true }
        start_date: { type: string, format: date, nullable: true }
        end_date: { type: string, format: date, nullable: true }
    TaskHistory:
      type: object
      properties:
        id: { type: integer }
        task_id: { type: integer }
        old_status: { allOf: [{ $ref: '#/components/schemas/TaskStatus' }], nullable: true, description: Görev oluşturulduğunda null }
        new_status: { $ref: '#/components/schemas/TaskStatus' }
        changed_by_id: { type: integer, nullable: true, description: Kullanıcı silindiyse null }
        changed_at: { type: string, format: date-time }
    Comment:
      type: object
      properties:
        id: { type: integer }
        task_id: { type: integer }
        author_id: { type: integer, nullable: true, description: Kullanıcı silindiyse null }
        content: { type: string }
        created_at: { type: string, format: date-time }
    Error:
      type: object
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: VALIDATION_ERROR }
            message: { type: string, example: Gönderilen veriler geçersiz. }
            details:
              type: array
              items:
                type: object
                properties:
                  field: { type: string, example: email }
                  message: { type: string, example: Geçerli bir e-posta adresi girin. }
  responses:
    ValidationError:
      description: Doğrulama hatası (VALIDATION_ERROR / INVALID_JSON)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthorized:
      description: Kimlik doğrulaması yok veya geçersiz (UNAUTHORIZED)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Yetki yok (FORBIDDEN)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Bulunamadı (NOT_FOUND)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: Çakışma (CONFLICT)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    PayloadTooLarge:
      description: İstek gövdesi 1 MB sınırını aşıyor (PAYLOAD_TOO_LARGE)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    TooManyRequests:
      description: Aynı IP'den 15 dakikada 5 başarısız giriş denemesi aşıldı (TOO_MANY_REQUESTS). `Retry-After` başlığı bekleme süresini verir.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    ServiceUnavailable:
      description: Veri tabanına ulaşılamıyor (SERVICE_UNAVAILABLE)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
